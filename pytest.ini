[pytest]
# DreamTale 项目 pytest 配置
# - testpaths 限定默认收集目录为 tests/（DreamTale 自有 Python 测试位置）
# - norecursedirs 排除 docs/（含 _haloread_reference 参考项目测试，import src.core/src.agents，
#   属 HaloRead 参考代码，不属于 DreamTale，收集会 ImportError 中断）、node_modules、.git、.trae
# DreamTale 回归测试主入口为 tests/run_regression_suite.sh（bash），pytest 为辅助。
testpaths = tests
norecursedirs = docs node_modules .git .trae .venv venv
